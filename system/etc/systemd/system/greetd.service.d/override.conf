[Service]
# On bootc/ostree images, /var is not part of the committed image content;
# dms-greeter's own %post scriptlet creates /var/cache/dms-greeter and
# /var/lib/greeter at package-install time, but that content does not survive
# into the final image. It's meant to be recreated at boot by
# systemd-tmpfiles-setup.service from the package's tmpfiles.d rule
# (/usr/lib/tmpfiles.d/dms-greeter.conf), but greetd was observed failing to
# start with "cache directory '/var/cache/dms-greeter' does not exist".
# Force-create it right before greetd starts, regardless of tmpfiles ordering.
ExecStartPre=/usr/bin/systemd-tmpfiles --create /usr/lib/tmpfiles.d/dms-greeter.conf
