name: build container
on: 
  workflow_dispatch:
  #push:
#   schedule:
#   # minute (0-59) hour (0-23) day of month (1-31) month (1-12) day of week (SUN-SAT) 
#   # Triggers Fri at 13:30
#   - cron: '30 13 * * FRI'

jobs:
  leksi-os:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: free disk space (ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: run podman build
      run: podman build -t leksi-os --disable-compression=false .
    - name: push image to ghcr.io
      run: podman push --creds=${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} leksi-os ghcr.io/a-leksi1/leksi-os:latest