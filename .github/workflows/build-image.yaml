name: build container
on: 
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
  # minute (0-59) hour (0-23) day of month (1-31) month (1-12) day of week (SUN-SAT)
  # Triggers every day at 06:00 UTC, after the daily Silverblue base update
  - cron: '0 6 * * *'

jobs:
  leksi-os:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - name: free disk space (ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: find base image with a matching NVIDIA module
      run: scripts/find-base.sh >> $GITHUB_ENV
    # Root's storage, so the rechunk container below can read the image
    - name: run podman build
      run: sudo podman build --build-arg FEDORA_VERSION=$FEDORA_VERSION --build-arg BASE_TAG=$BASE_TAG --build-arg KERNEL_VERSION=$KERNEL_VERSION -t localhost/leksi-os:unchunked .
    # Splits the image into layers grouped by package, so an update only
    # downloads the packages that changed. --previous-build keeps the layout of
    # the published image, so unchanged layers keep the same digest.
    - name: rechunk image
      run: |
        sudo podman run --rm --privileged --security-opt label=disable \
          -v /var/lib/containers:/var/lib/containers \
          localhost/leksi-os:unchunked \
          rpm-ostree compose build-chunked-oci --bootc --format-version=2 --max-layers 128 \
            --from localhost/leksi-os:unchunked \
            --previous-build docker://ghcr.io/a-leksi1/leksi-os:latest \
            --output containers-storage:localhost/leksi-os:latest
    - name: push image to ghcr.io
      run: sudo podman push --digestfile /tmp/digest --creds=${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} localhost/leksi-os:latest ghcr.io/a-leksi1/leksi-os:latest
    # cosign v3 defaults to a new signature format that rpm-ostree/bootc can't read yet
    - uses: sigstore/cosign-installer@v3
      with:
        cosign-release: 'v2.5.0'
    - name: sign image
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
        cosign sign -y --key env://COSIGN_PRIVATE_KEY ghcr.io/a-leksi1/leksi-os@$(cat /tmp/digest)
        # fails the run if the secret doesn't match cosign.pub
        cosign verify --key cosign.pub ghcr.io/a-leksi1/leksi-os@$(cat /tmp/digest)